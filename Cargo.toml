[package]
name = "yue2"
version = "0.1.0"
edition = "2021"
description = "Checkpoint-native YuE2 inference on candle"
license = "Apache-2.0"

[features]
default = []
cuda = ["candle-core/cuda", "candle-nn/cuda"]
flash-attn = ["cuda", "dep:candle-flash-attn"]
metal = ["candle-core/metal", "candle-nn/metal"]

[dependencies]
anyhow = "1"
base64 = "0.22"
candle-core = "0.11"
candle-nn = "0.11"
candle-flash-attn = { version = "0.11", optional = true }
half = "2"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiktoken-rs = "0.12"
unicode-normalization = "0.1"

[profile.test]
opt-level = 2
